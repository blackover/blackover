# Body axes: origin at the aerodynamic reference point, x FORWARD, z DOWN.

empty_mass: "8600 kg"
max_takeoff_mass: "19200 kg"
max_landing_mass: "15500 kg"

# "Payload" here is external stores mass on the pylons. It is modelled purely
# as mass and, through drag.cd_stores, as parasite drag. Nothing in this
# package represents a weapon, a sensor or a mission system.
max_payload: "5400 kg"

# Converted from open published values in slug ft2. Note how much smaller the
# roll inertia is than the transport's relative to pitch and yaw -- that ratio,
# not the aerodynamics alone, is why this aircraft rolls the way it does.
inertia:
  ixx: "12874 kgm2"
  iyy: "75672 kgm2"
  izz: "85551 kgm2"
  ixz: "1331 kgm2"

# Empty CG marginally forward of the reference point. The quoted cm_alpha of
# -0.40 /rad corresponds to a static margin near 11.6 % MAC: positively stable,
# but far closer to neutral than the transport, which is what makes this
# aircraft feel immediate in pitch and unforgiving when it is loaded aft.
empty_cg:
  x: "0.04 m"
  y: "0.0 m"
  z: "0.05 m"

payload_cg:
  x: "0.10 m"
  y: "0.0 m"
  z: "0.55 m"

cg_forward_limit: "0.30 m"
cg_aft_limit: "-0.18 m"

tanks:
  - name: fuselage_forward
    capacity: "1450 kg"
    position: { x: "0.85 m", y: "0.0 m", z: "0.10 m" }
  - name: fuselage_aft
    capacity: "1350 kg"
    position: { x: "-1.10 m", y: "0.0 m", z: "0.05 m" }
  - name: left_wing
    capacity: "620 kg"
    position: { x: "-0.20 m", y: "-1.95 m", z: "0.15 m" }
  - name: right_wing
    capacity: "620 kg"
    position: { x: "-0.20 m", y: "1.95 m", z: "0.15 m" }
