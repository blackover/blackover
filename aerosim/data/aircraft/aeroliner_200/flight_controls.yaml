# Surface travel, rate limits and actuator lag.
#
# The aerodynamic derivatives are quoted per unit of NORMALISED deflection, so
# max_deflection here sets what "1.0" physically means and is used to convert
# the quoted deg/s rate into normalised travel per second.

elevator:
  max_deflection: "25.0 deg"
  max_rate: "40.0 deg/s"
  time_constant: "0.06 s"

aileron:
  max_deflection: "20.0 deg"
  max_rate: "60.0 deg/s"
  time_constant: "0.05 s"

rudder:
  max_deflection: "25.0 deg"
  max_rate: "45.0 deg/s"
  time_constant: "0.07 s"

flaps:
  max_deflection: "40.0 deg"
  transit_time: "14.0 s"
  detents: [0.0, 0.25, 0.50, 0.75, 1.0]

speedbrake:
  transit_time: "2.5 s"

# Stability augmentation. Not a pilot aid -- an aircraft system, fitted
# because the airframe's own dutch roll damps at 0.065 (at the design
# report's 20,000 ft; a mode belongs to a trim point) against a Level 1
# target of 0.08 and no sensible fin closes that gap.
#
# The washout is what makes this a damper rather than a rudder autopilot: it
# passes the oscillation and blocks the steady yaw rate of a turn, so the
# system is silent when the aircraft is doing what the pilot asked.
yaw_damper:
  available: true
  gain: 0.75          # normalised rudder per rad/s of transient yaw rate
  washout: "4.0 s"    # high-pass time constant
  authority: 0.16     # of full rudder travel, so about 4 degrees
